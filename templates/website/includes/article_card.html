<article class="article-card">
  <a class="article-card-link" href="{% url 'website:article_detail' article.slug %}">
    {% if article.cover %}<img class="article-cover" src="{{ article.cover.url }}" alt="">{% if article.cover_credit %}<small class="photo-credit">{{ article.cover_credit }}</small>{% endif %}{% else %}<div class="article-cover article-cover-placeholder" aria-hidden="true"><span>PCM<br>Kottabarat</span></div>{% endif %}
    <div class="article-card-body">
      <time datetime="{{ article.published_at|date:'c' }}">{{ article.published_at|date:"d F Y" }}</time>
      <h3>{{ article.title }}</h3>
      <p>{{ article.summary|truncatewords:24 }}</p>
      <span class="text-link">Baca selengkapnya <span aria-hidden="true">→</span></span>
    </div>
  </a>
</article>
